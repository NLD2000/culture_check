<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>A320 Tasksharing Mobile</title>
  <style>
:root {
  color-scheme: light;
  --bg: #f6f7f9;
  --surface: #ffffff;
  --ink: #121417;
  --muted: #68707b;
  --line: #d6dbe2;
  --strong: #0b1721;
  --accent: #006b5f;
  --accent-2: #c9412f;
  --warning: #e66a00;
  --ok: #149000;
  --blue: #5757ff;
  --shadow: 0 10px 28px rgba(8, 18, 28, .08);
  --radius: 8px;
}
* { box-sizing: border-box; }
html { min-height: 100%; background: var(--bg); }
body {
  min-height: 100%;
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Arial, sans-serif;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
button, select, input { font: inherit; }
.app {
  width: 100%;
  max-width: 480px;
  min-height: 100svh;
  margin: 0 auto;
  padding: max(12px, env(safe-area-inset-top)) 12px max(18px, env(safe-area-inset-bottom));
}
header {
  padding: 6px 2px 10px;
}
.kicker {
  margin: 0 0 4px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
}
h1 {
  margin: 0;
  color: var(--strong);
  font-size: 28px;
  line-height: 1.05;
  font-weight: 900;
  letter-spacing: 0;
}
.controls {
  position: sticky;
  top: 0;
  z-index: 10;
  margin: 0 -12px 12px;
  padding: 8px 12px 10px;
  background: rgba(246, 247, 249, .94);
  border-bottom: 1px solid rgba(214, 219, 226, .9);
  backdrop-filter: blur(18px);
}
.control-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 8px;
}
.segmented {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: #e9edf2;
}
.segmented input { position: absolute; opacity: 0; pointer-events: none; }
.segmented span {
  display: flex;
  min-height: 42px;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  color: #3a424d;
  font-size: 15px;
  font-weight: 900;
  letter-spacing: .02em;
}
.segmented input:checked + span {
  color: #fff;
  background: var(--strong);
  box-shadow: 0 2px 8px rgba(10, 20, 30, .16);
}
.select-wrap {
  display: grid;
  grid-template-columns: 1fr;
  gap: 5px;
}
.select-label {
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .04em;
  text-transform: uppercase;
}
select {
  width: 100%;
  min-height: 46px;
  appearance: none;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 0 42px 0 12px;
  color: var(--ink);
  background: #fff linear-gradient(45deg, transparent 50%, #5d6671 50%) right 18px center / 7px 7px no-repeat;
  font-size: 16px;
  font-weight: 800;
}
.status {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
}
.status-main {
  min-width: 0;
  font-size: 14px;
  font-weight: 850;
  color: var(--strong);
}
.status-sub {
  margin-top: 2px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}
.reset-btn {
  min-width: 44px;
  min-height: 38px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--accent-2);
  background: #fff;
  font-weight: 900;
}
.section {
  margin-top: 14px;
}
.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 18px 2px 8px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 900;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.section-title::after {
  content: "";
  height: 1px;
  flex: 1;
  background: var(--line);
}
.item-card {
  display: grid;
  grid-template-columns: 34px 1fr;
  gap: 10px;
  align-items: start;
  width: 100%;
  margin: 8px 0;
  padding: 12px 12px 12px 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: 0 1px 0 rgba(10, 20, 30, .04);
}
.item-card.done { opacity: .62; }
.check {
  width: 30px;
  height: 30px;
  margin: 1px 0 0;
  accent-color: var(--accent);
}
.item-body { min-width: 0; }
.note {
  margin: 0 0 7px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.35;
  font-weight: 750;
}
.task-line {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(88px, 38%);
  gap: 8px;
  align-items: end;
}
.label {
  min-width: 0;
  overflow-wrap: anywhere;
  color: var(--strong);
  font-size: 16px;
  line-height: 1.18;
  font-weight: 900;
  letter-spacing: .015em;
}
.action {
  color: var(--strong);
  font-size: 14px;
  line-height: 1.15;
  text-align: right;
  font-weight: 900;
  overflow-wrap: anywhere;
}
.shared-pill, .role-pill {
  display: inline-flex;
  align-items: center;
  height: 20px;
  margin: 0 0 7px;
  padding: 0 7px;
  border-radius: 999px;
  background: #eef5f4;
  color: var(--accent);
  font-size: 11px;
  font-weight: 900;
  letter-spacing: .05em;
}
.role-pill { background: #eef0f4; color: #44505d; }
.text-block {
  margin: 8px 0;
  padding: 11px 12px;
  border-left: 4px solid var(--accent);
  border-radius: 0 var(--radius) var(--radius) 0;
  background: #fff;
  color: var(--strong);
  font-size: 14px;
  line-height: 1.4;
  font-weight: 800;
}
.empty {
  margin-top: 22px;
  padding: 22px 14px;
  border: 1px dashed #b9c0ca;
  border-radius: var(--radius);
  color: var(--muted);
  background: #fff;
  text-align: center;
  font-weight: 800;
}
.green { color: var(--ok); font-weight: 900; }
.orange { color: var(--warning); font-weight: 900; }
.blue { color: var(--blue); font-weight: 900; }
u { text-underline-offset: 2px; }
#source { display: none; }
@media (max-width: 360px) {
  .app { padding-left: 9px; padding-right: 9px; }
  .controls { margin-left: -9px; margin-right: -9px; padding-left: 9px; padding-right: 9px; }
  h1 { font-size: 25px; }
  .label { font-size: 15px; }
  .action { font-size: 13px; }
}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <p class="kicker">A320 Normal Procedures</p>
      <h1>Tasksharing</h1>
    </header>

    <section class="controls" aria-label="Filter">
      <div class="control-row">
        <div class="segmented" role="radiogroup" aria-label="Crew role">
          <label><input type="radio" name="crewRole" value="CM1" checked><span>CM1</span></label>
          <label><input type="radio" name="crewRole" value="CM2"><span>CM2</span></label>
        </div>
        <div class="segmented" role="radiogroup" aria-label="Flight function">
          <label><input type="radio" name="flightFunction" value="PF" checked><span>PF</span></label>
          <label><input type="radio" name="flightFunction" value="PM"><span>PM</span></label>
        </div>
      </div>
      <label class="select-wrap">
        <span class="select-label">Flugphase</span>
        <select id="phaseSelect"></select>
      </label>
    </section>

    <section class="status" aria-live="polite">
      <div>
        <div class="status-main" id="statusMain">Bereit</div>
        <div class="status-sub" id="statusSub">Wähle Rolle, Funktion und Phase.</div>
      </div>
      <button class="reset-btn" id="resetPhase" type="button" aria-label="Diese Phase zurücksetzen">↺</button>
    </section>

    <main id="checklist" aria-live="polite"></main>
  </div>

  <template id="source">
<main class="page"><h1>Safety Exterior Inspection</h1>
<table class="checklist">
<thead><tr><th>CM1</th><th>CM2</th></tr></thead>
<tbody>
<tr><td></td><td><div class="item "><span class="label">WHEEL CHOCKS</span><span class="dots"></span><span class="action">CHECK</span></div></td></tr>
<tr><td></td><td><div class="item "><span class="label">L/G DOORS</span><span class="dots"></span><span class="action">CHECK POSITION</span></div></td></tr>
<tr><td></td><td><div class="item "><span class="label">APU AREA</span><span class="dots"></span><span class="action">CHECK</span></div></td></tr>
</tbody></table>
</main>
<main class="page"><h1>Preliminary Cockpit Preparation</h1>
<div class="section-title ">Aircraft Setup</div>
<table class="checklist">
<thead><tr><th>CM1</th><th>CM2</th></tr></thead>
<tbody>
<tr><td></td><td><div class="item "><span class="label">ENG 1, 2 MASTER LEVERS</span><span class="dots"></span><span class="action">OFF</span></div></td></tr>
<tr><td></td><td><div class="item "><span class="label">ENG MODE selector</span><span class="dots"></span><span class="action">NORM</span></div></td></tr>
<tr><td></td><td><div class="item "><span class="label">*WEATHER RADAR</span><span class="dots"></span><span class="action">OFF</span></div></td></tr>
<tr><td></td><td><div class="item "><span class="label">*WINDSHEAR/PWS SW</span><span class="dots"></span><span class="action">OFF</span></div></td></tr>
<tr><td></td><td><div class="item "><span class="label">L/G lever</span><span class="dots"></span><span class="action">DOWN</span></div></td></tr>
<tr><td></td><td><div class="item "><span class="label">Both WIPER selectors</span><span class="dots"></span><span class="action">OFF</span></div></td></tr>
</tbody></table>
<div class="section-title ">Batteries/External Power</div>
<table class="checklist">
<thead><tr><th>CM1</th><th>CM2</th></tr></thead>
<tbody>
<tr><td></td><td><div class="item "><span class="label">BAT</span><span class="dots"></span><span class="action">CHECK/AUTO</span></div></td></tr>
<tr><td></td><td><div class="item "><span class="label">EXT PWR pb</span><span class="dots"></span><span class="action">ON</span></div></td></tr>
</tbody></table>
<div class="section-title ">APU Fire Test/APU Start</div>
<table class="checklist">
<thead><tr><th>CM1</th><th>CM2</th></tr></thead>
<tbody>
<tr><td></td><td><div class="item "><span class="label">RMP 1 and 2</span><span class="dots"></span><span class="action">CHECK ON/SET</span></div></td></tr>
<tr><td></td><td><div class="item "><span class="label">ACP</span><span class="dots"></span><span class="action">CHECK ON/SET</span></div></td></tr>
<tr><td></td><td><div class="item "><span class="label">APU FIRE TEST</span><span class="dots"></span><span class="action">PERFORM</span></div></td></tr>
<tr><td></td><td><div class="item "><span class="label">APU</span><span class="dots"></span><span class="action">START</span></div></td></tr>
<tr><td></td><td><div class="wide-note">When the APU is AVAIL:</div><div class="item "><span class="label">AIR COND panel</span><span class="dots"></span><span class="action">SET</span></div></td></tr>
<tr><td></td><td><div class="item "><span class="label">*EXT PWR pb</span><span class="dots"></span><span class="action">AS RQRD</span></div></td></tr>
</tbody></table>
<div class="section-title left">ADIRS</div>
<table class="checklist">
<thead><tr><th>CM1</th><th>CM2</th></tr></thead>
<tbody>
<tr><td></td><td><div class="item "><span class="label">*ALL IR MODE selector</span><span class="dots"></span><span class="action">NAV</span></div></td></tr>
</tbody></table>
<div class="section-title ">Cockpit Lights</div>
<table class="checklist">
<thead><tr><th>CM1</th><th>CM2</th></tr></thead>
<tbody>
<tr><td><div class="item "><span class="label">*COCKPIT LIGHTS</span><span class="dots"></span><span class="action">AS RQRD</span></div></td><td><div class="item "><span class="label">*COCKPIT LIGHTS</span><span class="dots"></span><span class="action">AS RQRD</span></div></td></tr>
</tbody></table>
<div class="section-title left">EFB/ACARS/AOC Initialization</div>
<table class="checklist">
<thead><tr><th>CM1</th><th>CM2</th></tr></thead>
<tbody>
<tr><td><div class="item "><span class="label">All EFB</span><span class="dots"></span><span class="action">START</span></div></td><td><div class="item "><span class="label">All EFB</span><span class="dots"></span><span class="action">START</span></div></td></tr>
<tr><td><div class="item "><span class="label">EFB Version and Database</span><span class="dots"></span><span class="action">CHECK</span></div></td><td><div class="item "><span class="label">EFB Version and Database</span><span class="dots"></span><span class="action">CHECK</span></div></td></tr>
<tr><td><div class="item "><span class="label">*ACARS/AOC</span><span class="dots"></span><span class="action">INITIALIZE</span></div></td><td></td></tr>
<tr><td colspan="2"><div class="wide-note">For operations with the ACARS/AOC or the EFB, when a synchronization with the avionics is available:</div></td></tr>
<tr><td><div class="wide-note"><u>FMGS PRE-INITIALIZATION</u></div><div class="item "><span class="label">*ENGINE & AIRCRAFT TYPE</span><span class="dots"></span><span class="action">CHECK</span></div></td><td><div class="wide-note"><u>FMGS PRE-INITIALIZATION</u></div><div class="item "><span class="label">*ENGINE & AIRCRAFT TYPE</span><span class="dots"></span><span class="action">CHECK</span></div></td></tr>
<tr><td><div class="item "><span class="label">*DATABASE VALID</span><span class="dots"></span><span class="action">CHECK</span></div></td><td><div class="item "><span class="label">*DATABASE VALID</span><span class="dots"></span><span class="action">CHECK</span></div></td></tr>
<tr><td><div class="item "><span class="label">*FLT NBR & FROM/TO</span><span class="dots"></span><span class="action">INSERT/CHECK</span></div></td><td><div class="item "><span class="label">*FLT NBR & FROM/TO</span><span class="dots"></span><span class="action">INSERT/CHECK</span></div></td></tr>
<tr><td><div class="item "><span class="label">*EFB</span><span class="dots"></span><span class="action">INITIALIZE</span></div></td><td><div class="item "><span class="label">*EFB</span><span class="dots"></span><span class="action">INITIALIZE</span></div></td></tr>
</tbody></table>
<div class="section-title left">Aircraft Acceptance</div>
<table class="checklist">
<thead><tr><th>CM1</th><th>CM2</th></tr></thead>
<tbody>
<tr><td><div class="item "><span class="label">*RCL pb</span><span class="dots"></span><span class="action">PRESS 3 s</span></div></td><td></td></tr>
<tr><td colspan="2"><div class="item "><span class="label">*LOGBOOK AND MEL/CDL ITEMS</span><span class="dots"></span><span class="action">CHECK</span></div></td></tr>
<tr><td colspan="2"><div class="item "><span class="label">AIRCRAFT CONFIGURATION SUMMARY</span><span class="dots"></span><span class="action">CHECK</span></div></td></tr>
<tr><td colspan="2"><div class="item "><span class="label">*OEB</span><span class="dots"></span><span class="action">CHECK</span></div></td></tr>
<tr><td><div class="item "><span class="label">*AIRCRAFT ACCEPTANCE</span><span class="dots"></span><span class="action">PERFORM</span></div></td><td></td></tr>
</tbody></table>
<div class="section-title left">Preliminary Performance Determination</div>
<table class="checklist">
<thead><tr><th>CM1</th><th>CM2</th></tr></thead>
<tbody>
<tr><td><div class="item "><span class="label">*AIRFIELD DATA</span><span class="dots"></span><span class="action">OBTAIN</span></div></td><td><div class="item "><span class="label">*AIRFIELD DATA</span><span class="dots"></span><span class="action">OBTAIN</span></div></td></tr>
<tr><td colspan="2"><div class="wide-note">If an EFB application for load and trim sheet is used:</div></td></tr>
<tr><td><div class="item "><span class="label">*PRELIMINARY LOADING</span><span class="dots"></span><span class="action">COMPUTE/CROSSCHECK</span></div></td><td><div class="item "><span class="label">*PRELIMINARY LOADING</span><span class="dots"></span><span class="action">COMPUTE/CROSSCHECK</span></div></td></tr>
<tr><td><div class="item "><span class="label">*MEL/CDL ITEMS</span><span class="dots"></span><span class="action">CHECK</span></div></td><td><div class="item "><span class="label">*MEL/CDL ITEMS</span><span class="dots"></span><span class="action">CHECK</span></div></td></tr>
<tr><td colspan="2"><div class="item "><span class="label">*NAVIGATION CHARTS</span><span class="dots"></span><span class="action">PREPARE</span></div></td></tr>
<tr><td><div class="item "><span class="label">*PRELIM T.O PERF DATA</span><span class="dots"></span><span class="action">COMPUTE</span></div></td><td><div class="item "><span class="label">*PRELIM T.O PERF DATA</span><span class="dots"></span><span class="action">COMPUTE</span></div></td></tr>
<tr><td colspan="2"><div class="item "><span class="label">*PRELIM T.O PERF DATA</span><span class="dots"></span><span class="action">CROSSCHECK</span></div></td></tr>
</tbody></table>
<div class="section-title left">Before Walkaround</div>
<table class="checklist">
<thead><tr><th>PF</th><th>PM</th></tr></thead>
<tbody>
<tr><td></td><td><div class="item "><span class="label">*ECAM OXY PRESS/HYD QTY/ENG OIL QTY</span><span class="dots"></span><span class="action">CHECK</span></div></td></tr>
<tr><td></td><td><div class="item "><span class="label">FLAPS</span><span class="dots"></span><span class="action">CHECK POSITION</span></div></td></tr>
<tr><td></td><td><div class="item "><span class="label">*SPEED BRAKE lever</span><span class="dots"></span><span class="action">CHECK RET AND DISARMED</span></div></td></tr>
<tr><td></td><td><div class="item "><span class="label">*ACCU PRESS</span><span class="dots"></span><span class="action">CHECK</span></div></td></tr>
<tr><td></td><td><div class="item "><span class="label">*PARK BRK handle</span><span class="dots"></span><span class="action">AS RQRD</span></div></td></tr>
<tr><td></td><td><div class="item "><span class="label">*BRAKES PRESS indicator</span><span class="dots"></span><span class="action">CHECK</span></div></td></tr>
<tr><td></td><td><div class="item "><span class="label">ALTN BRAKING</span><span class="dots"></span><span class="action">CHECK</span></div></td></tr>
<tr><td></td><td><div class="item "><span class="label">EMER EQPT</span><span class="dots"></span><span class="action">CHECK</span></div></td></tr>
<tr><td></td><td><div class="item "><span class="label">RAIN REPELLENT</span><span class="dots"></span><span class="action">CHECK</span></div></td></tr>
<tr><td></td><td><div class="item "><span class="label">C/B PANELS</span><span class="dots"></span><span class="action">CHECK</span></div></td></tr>
<tr><td></td><td><div class="item "><span class="label">*GEAR PINS</span><span class="dots"></span><span class="action">CHECK ONBOARD/STOWED</span></div></td></tr>
<tr><td></td><td><div class="item "><span class="label">*IF PFC NOT PERFORMED BY MAINTENANCE</span><span class="dots"></span><span class="action">PFC PERFORM</span></div></td></tr>
</tbody></table>
</main>
<main class="page"><h1>Cockpit Preparation</h1>
<div class="section-title left">Overhead Panel</div>
<table class="checklist">
<thead><tr><th>PF</th><th>PM</th></tr></thead>
<tbody>
<tr><td><div class="wide-note">As a general rule, during the scan sequence:</div><div class="item "><span class="label">*All white lights (except MAINTENANCE panel)</span><span class="dots"></span><span class="action">OFF</span></div></td><td></td></tr>
<tr><td><div class="item "><span class="label">*RCDR GND CTL pb-sw</span><span class="dots"></span><span class="action">ON</span></div></td><td></td></tr>
<tr><td><div class="item "><span class="label">CVR TEST pb</span><span class="dots"></span><span class="action">PRESS and MAINTAIN</span></div></td><td></td></tr>
<tr><td><div class="item "><span class="label">CAPT & PURS/CAPT sw</span><span class="dots"></span><span class="action">AS RQRD</span></div></td><td></td></tr>
<tr><td><div class="item "><span class="label">EXTERIOR LIGHTS</span><span class="dots"></span><span class="action">SET</span></div></td><td></td></tr>
<tr><td><div class="item "><span class="label">*SIGNS panel</span><span class="dots"></span><span class="action">SET</span></div></td><td></td></tr>
<tr><td><div class="item "><span class="label">PROBE/WINDOW HEAT pb-sw</span><span class="dots"></span><span class="action">AUTO</span></div></td><td></td></tr>
<tr><td><div class="item "><span class="label">LDG ELEV</span><span class="dots"></span><span class="action">AUTO</span></div></td><td></td></tr>
<tr><td><div class="item "><span class="label">*PACK FLOW</span><span class="dots"></span><span class="action">AS RQRD</span></div></td><td></td></tr>
<tr><td><div class="item "><span class="label">ELEC panel</span><span class="dots"></span><span class="action">CHECK</span></div></td><td></td></tr>
<tr><td><div class="item "><span class="label">BAT</span><span class="dots"></span><span class="action">CHECK</span></div></td><td></td></tr>
<tr><td><div class="item "><span class="label">*FUEL CTR TK MODE SEL pb-sw</span><span class="dots"></span><span class="action">CHECK AUTO</span></div></td><td></td></tr>
<tr><td><div class="item "><span class="label">ENG FIRE</span><span class="dots"></span><span class="action">CHECK/TEST</span></div></td><td></td></tr>

    phase: phaseSelect.value
  });
  const keyFor = (state, item) => storagePrefix + [state.crewRole, state.flightFunction, state.phase, item.id].join('|');

  function extractItemsFromCell(cell, owner) {
    const items = [];
    const pendingNotes = [];
    Array.from(cell.children).forEach((child) => {
      if (child.classList.contains('wide-note') || child.classList.contains('note')) {
        const note = clean(child.textContent);
        if (note) pendingNotes.push(child.innerHTML.trim());
        return;
      }
      if (child.classList.contains('item')) {
        const label = child.querySelector('.label');
        const action = child.querySelector('.action');
        const labelText = label ? clean(label.textContent) : clean(child.textContent);
        const actionText = action ? clean(action.textContent) : '';
        items.push({
          type: 'item',
          owner,
          notes: pendingNotes.splice(0),
          label: label ? label.innerHTML.trim() : labelText,
          action: action ? action.innerHTML.trim() : actionText,
          textKey: clean([owner, labelText, actionText].join(' '))
        });
        return;
      }
      const text = clean(child.textContent);
      if (text) {
        items.push({ type: 'text', owner, notes: pendingNotes.splice(0), html: child.innerHTML.trim(), textKey: clean([owner, text].join(' ')) });
      }
    });
    if (pendingNotes.length) {
      pendingNotes.forEach((html) => items.push({ type: 'text', owner, notes: [], html, textKey: clean([owner, html].join(' ')) }));
    }
    return items;
  }

  function parseSource() {
    return Array.from(source.content.querySelectorAll('main.page')).map((page, phaseIndex) => {
      const title = clean(page.querySelector('h1')?.textContent || 'Phase ' + (phaseIndex + 1));
      const blocks = [];
      let currentSection = '';
      Array.from(page.children).forEach((node) => {
        if (node.matches?.('h1')) return;
        if (node.classList?.contains('section-title')) {
          currentSection = clean(node.textContent);
          return;
        }
        if (!node.matches?.('table.checklist')) return;
        const headers = Array.from(node.querySelectorAll('thead th')).map((th) => clean(th.textContent));
        const axis = headers.includes('CM1') || headers.includes('CM2') ? 'crewRole' : 'flightFunction';
        Array.from(node.querySelectorAll('tbody tr')).forEach((row, rowIndex) => {
          const cells = Array.from(row.children);
          cells.forEach((cell, cellIndex) => {
            const shared = cell.colSpan === 2;
            const owner = shared ? 'ALL' : headers[cellIndex];
            const extracted = extractItemsFromCell(cell, owner);
            extracted.forEach((entry, entryIndex) => {
              const id = hash([title, currentSection, axis, rowIndex, cellIndex, entryIndex, entry.textKey].join('|'));
              blocks.push({ ...entry, id, title, section: currentSection, axis, shared });
            });
          });
        });
      });
      return { title, blocks };
    });
  }

  const phases = parseSource();
  phases.forEach((phase, index) => {
    const option = document.createElement('option');
    option.value = String(index);
    option.textContent = phase.title;
    phaseSelect.appendChild(option);
  });

  function isRelevant(block, state) {
    if (block.shared || block.owner === 'ALL') return true;
    if (block.axis === 'crewRole') return block.owner === state.crewRole;
    return block.owner === state.flightFunction;
  }

  function render() {
    const state = readState();
    const phase = phases[Number(state.phase)] || phases[0];
    const relevant = phase.blocks.filter((block) => isRelevant(block, state));
    checklist.innerHTML = '';
    let currentSection = null;
    let itemCount = 0;
    let doneCount = 0;

    relevant.forEach((block) => {
      if (block.section !== currentSection) {
        currentSection = block.section;
        if (currentSection) {
          const heading = document.createElement('div');
          heading.className = 'section-title';
          heading.textContent = currentSection;
          checklist.appendChild(heading);
        }
      }

      if (block.type === 'item') {
        itemCount += 1;
        const storageKey = keyFor(state, block);
        const done = localStorage.getItem(storageKey) === '1';
        if (done) doneCount += 1;
        const label = document.createElement('label');
        label.className = 'item-card' + (done ? ' done' : '');
        label.innerHTML = '<input class="check" type="checkbox" ' + (done ? 'checked' : '') + ' aria-label="Punkt abhaken">' +
          '<div class="item-body">' +
          (block.shared ? '<span class="shared-pill">Shared</span>' : '<span class="role-pill">' + block.owner + '</span>') +
          block.notes.map((note) => '<p class="note">' + note + '</p>').join('') +
          '<div class="task-line"><div class="label">' + block.label + '</div><div class="action">' + block.action + '</div></div>' +
          '</div>';
        const checkbox = label.querySelector('input');
        checkbox.addEventListener('change', () => {
          if (checkbox.checked) localStorage.setItem(storageKey, '1');
          else localStorage.removeItem(storageKey);
          render();
        });
        checklist.appendChild(label);
        return;
      }

      const textBlock = document.createElement('div');
      textBlock.className = 'text-block';
      textBlock.innerHTML = block.notes.map((note) => '<p class="note">' + note + '</p>').join('') + block.html;
      checklist.appendChild(textBlock);
    });

    if (!relevant.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'Für diese Auswahl sind in dieser Flugphase keine Punkte hinterlegt.';
      checklist.appendChild(empty);
    }

    statusMain.textContent = state.crewRole + ' / ' + state.flightFunction + ' · ' + phase.title;
    statusSub.textContent = itemCount ? doneCount + ' von ' + itemCount + ' Punkten erledigt' : 'Keine abhakbaren Punkte in dieser Auswahl';
  }

  function resetCurrentPhase() {
    const state = readState();
    const phase = phases[Number(state.phase)] || phases[0];
    phase.blocks.filter((block) => block.type === 'item' && isRelevant(block, state)).forEach((block) => {
      localStorage.removeItem(keyFor(state, block));
    });
    render();
  }

  document.querySelectorAll('input[name="crewRole"], input[name="flightFunction"]').forEach((input) => {
    input.addEventListener('change', render);
  });
  phaseSelect.addEventListener('change', render);
  resetPhase.addEventListener('click', resetCurrentPhase);
  render();
})();
  </script>
</body>
</html>
