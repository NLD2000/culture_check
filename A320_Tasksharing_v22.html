<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>A320 Tasksharing Mobile</title>
  <style>
:root {
  color-scheme: light;
  --bg: #f6f7f9;
  --surface: #ffffff;
  --ink: #121417;
  --muted: #68707b;
  --line: #d6dbe2;
  --strong: #0b1721;
  --accent: #006b5f;
  --accent-2: #c9412f;
  --warning: #e66a00;
  --ok: #149000;
  --blue: #5757ff;
  --shadow: 0 10px 28px rgba(8, 18, 28, .08);
  --radius: 8px;
}
* { box-sizing: border-box; }
html { min-height: 100%; background: var(--bg); }
body {
  min-height: 100%;
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Arial, sans-serif;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
button, select, input { font: inherit; }
.app {
  width: 100%;
  max-width: 480px;
  min-height: 100svh;
  margin: 0 auto;
  padding: max(12px, env(safe-area-inset-top)) 12px max(18px, env(safe-area-inset-bottom));
}
header {
  padding: 6px 2px 10px;
}
.kicker {
  margin: 0 0 4px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
}
h1 {
  margin: 0;
  color: var(--strong);
  font-size: 28px;
  line-height: 1.05;
  font-weight: 900;
  letter-spacing: 0;
}
.controls {
  position: sticky;
  top: 0;
  z-index: 10;
  margin: 0 -12px 12px;
  padding: 8px 12px 10px;
  background: rgba(246, 247, 249, .94);
  border-bottom: 1px solid rgba(214, 219, 226, .9);
  backdrop-filter: blur(18px);
}
.control-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 8px;
}
.segmented {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: #e9edf2;
}
.segmented input { position: absolute; opacity: 0; pointer-events: none; }
.segmented span {
  display: flex;
  min-height: 42px;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  color: #3a424d;
  font-size: 15px;
  font-weight: 900;
  letter-spacing: .02em;
}
.segmented input:checked + span {
  color: #fff;
  background: var(--strong);
  box-shadow: 0 2px 8px rgba(10, 20, 30, .16);
}
.select-wrap {
  display: grid;
  grid-template-columns: 1fr;
  gap: 5px;
}
.option-panel {
  display: grid;
  gap: 8px;
  margin-top: 8px;
}
.switch-row {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 12px;
  min-height: 48px;
  padding: 9px 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: #fff;
}
.switch-copy {
  min-width: 0;
}
.switch-title {
  color: var(--strong);
  font-size: 14px;
  line-height: 1.15;
  font-weight: 900;
}
.switch-sub {
  margin-top: 2px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.2;
  font-weight: 750;
}
.switch {
  position: relative;
  display: inline-grid;
  grid-template-columns: 1fr 1fr;
  width: 82px;
  height: 34px;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: #e9edf2;
}
.switch input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}
.switch span {
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #59626e;
  font-size: 11px;
  font-weight: 950;
  letter-spacing: .03em;
}
.switch::before {
  content: "";
  position: absolute;
  top: 3px;
  bottom: 3px;
  left: 3px;
  width: calc(50% - 3px);
  border-radius: 999px;
  background: #fff;
  box-shadow: 0 2px 7px rgba(10, 20, 30, .14);
  transition: transform .16s ease, background .16s ease;
}
.switch:has(input:checked)::before {
  transform: translateX(100%);
  background: var(--strong);
}
.switch:has(input:checked) .switch-on {
  color: #fff;
}
.switch:not(:has(input:checked)) .switch-off {
  color: var(--strong);
}
.select-label {
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .04em;
  text-transform: uppercase;
}
select {
  width: 100%;
  min-height: 46px;
  appearance: none;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 0 42px 0 12px;
  color: var(--ink);
  background: #fff linear-gradient(45deg, transparent 50%, #5d6671 50%) right 18px center / 7px 7px no-repeat;
  font-size: 16px;
  font-weight: 800;
}
.status {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
}
.status-main {
  min-width: 0;
  font-size: 14px;
  font-weight: 850;
  color: var(--strong);
}
.status-sub {
  margin-top: 2px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}
.reset-btn {
  min-width: 44px;
  min-height: 38px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--accent-2);
  background: #fff;
  font-weight: 900;
}
.section {
  margin-top: 14px;
}
.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 18px 2px 8px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 900;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.section-title::after {
  content: "";
  height: 1px;
  flex: 1;
  background: var(--line);
}
.item-card {
  display: grid;
  grid-template-columns: 34px 1fr;
  gap: 10px;
  align-items: start;
  width: 100%;
  margin: 8px 0;
  padding: 12px 12px 12px 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: 0 1px 0 rgba(10, 20, 30, .04);
}
.item-card.done { opacity: .62; }
.item-card.has-sop {
  grid-template-columns: 34px 1fr auto;
}
.check {
  width: 30px;
  height: 30px;
  margin: 1px 0 0;
  accent-color: var(--accent);
}
.item-body { min-width: 0; }
.note {
  margin: 0 0 7px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.35;
  font-weight: 750;
}
.task-line {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(88px, 38%);
  gap: 8px;
  align-items: end;
}
.label {
  min-width: 0;
  overflow-wrap: anywhere;
  color: var(--strong);
  font-size: 16px;
  line-height: 1.18;
  font-weight: 900;
  letter-spacing: .015em;
}
.action {
  color: var(--strong);
  font-size: 14px;
  line-height: 1.15;
  text-align: right;
  font-weight: 900;
  overflow-wrap: anywhere;
}
.sop-btn {
  align-self: start;
  min-width: 46px;
  min-height: 30px;
  border: 1px solid #b7c3d0;
  border-radius: 999px;
  color: var(--accent);
  background: #f3faf8;
  font-size: 12px;
  font-weight: 950;
  letter-spacing: .04em;
}
.shared-pill, .role-pill {
  display: inline-flex;
  align-items: center;
  height: 20px;
  margin: 0 0 7px;
  padding: 0 7px;
  border-radius: 999px;
  background: #eef5f4;
  color: var(--accent);
  font-size: 11px;
  font-weight: 900;
  letter-spacing: .05em;
}
.role-pill { background: #eef0f4; color: #44505d; }
.text-block {
  margin: 8px 0;
  padding: 11px 12px;
  border-left: 4px solid var(--accent);
  border-radius: 0 var(--radius) var(--radius) 0;
  background: #fff;
  color: var(--strong);
  font-size: 14px;
  line-height: 1.4;
  font-weight: 800;
}
.condition-block {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 10px;
  border-left-color: var(--blue);
  background: #eef6ff;
}
.condition-copy {
  min-width: 0;
}
.empty {
  margin-top: 22px;
  padding: 22px 14px;
  border: 1px dashed #b9c0ca;
  border-radius: var(--radius);
  color: var(--muted);
  background: #fff;
  text-align: center;
  font-weight: 800;
}
.green { color: var(--ok); font-weight: 900; }
.orange { color: var(--warning); font-weight: 900; }
.blue { color: var(--blue); font-weight: 900; }
u { text-underline-offset: 2px; }
#source, #sopSource { display: none; }
.sop-overlay {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: none;
  background: rgba(8, 18, 28, .42);
}
.sop-overlay.open {
  display: block;
}
.sop-sheet {
  position: absolute;
  inset: max(12px, env(safe-area-inset-top)) 0 0;
  display: grid;
  grid-template-rows: auto 1fr;
  width: min(100%, 520px);
  margin: 0 auto;
  border-radius: 14px 14px 0 0;
  background: #fff;
  overflow: hidden;
  box-shadow: 0 -18px 42px rgba(8, 18, 28, .24);
}
.sop-header {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  align-items: center;
  padding: 14px 14px 10px;
  border-bottom: 1px solid var(--line);
}
.sop-eyebrow {
  color: var(--muted);
  font-size: 11px;
  font-weight: 900;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.sop-title {
  margin-top: 2px;
  color: var(--strong);
  font-size: 18px;
  line-height: 1.12;
  font-weight: 950;
}
.sop-close {
  width: 40px;
  height: 40px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--strong);
  background: #fff;
  font-size: 22px;
  font-weight: 900;
}
.sop-content {
  overflow: auto;
  padding: 14px 14px max(22px, env(safe-area-inset-bottom));
}
.sop-procedure + .sop-procedure {
  margin-top: 22px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
}
.sop-content h1 {
  margin: 0 0 14px;
  padding: 8px 10px;
  border: 2px solid var(--strong);
  color: #000;
  background: #fff;
  font-size: 22px;
  line-height: 1.1;
  text-align: center;
  font-weight: 950;
}
.sop-content h2 {
  margin: 18px 0 9px;
  color: #000;
  font-size: 15px;
  line-height: 1.15;
  font-weight: 950;
  text-decoration: underline;
}
.sop-content p,
.sop-content li {
  font-size: 14px;
  line-height: 1.35;
}
.sop-content p {
  margin: 8px 0;
}
.sop-content .sop-line {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(82px, 34%) auto;
  gap: 7px;
  align-items: end;
  margin: 9px 0 0;
  font-size: 14px;
  font-weight: 850;
  letter-spacing: 0;
}
.sop-content .sop-line .label {
  font-size: 14px;
}
.sop-content .sop-line .dots {
  display: none;
}
.sop-content .sop-line .action {
  font-size: 13px;
}
.sop-content .sop-line .role {
  min-width: 34px;
  padding-left: 7px;
  border-left: 2px solid #8b929b;
  color: #3c4651;
  font-size: 12px;
  font-weight: 950;
}
.sop-content .desc,
.sop-content .grey-box {
  margin: 7px 0 10px;
  padding: 6px 8px;
  background: #d7d7d7;
  color: #333;
  font-size: 13px;
  line-height: 1.35;
  font-style: italic;
  font-weight: 700;
}
.sop-content .note {
  margin: 8px 0;
  color: var(--ok);
  font-size: 13px;
  line-height: 1.35;
  font-style: italic;
  font-weight: 800;
}
.sop-content .tree {
  margin: 10px 0 14px 4px;
  padding-left: 12px;
  border-left: 3px solid #111;
}
.sop-content .warning,
.sop-content .caution {
  display: grid;
  grid-template-columns: 76px 1fr;
  margin: 12px 0 14px;
  font-size: 13px;
  line-height: 1.35;
  font-style: italic;
  font-weight: 750;
}
.sop-content .warning {
  border: 2px solid red;
  color: red;
}
.sop-content .caution {
  border: 2px solid #ff8c00;
  color: #ff5c00;
}
.sop-content .warning .tag,
.sop-content .caution .tag {
  padding: 9px;
  border-right: 2px solid currentColor;
  font-weight: 950;
}
.sop-content .warning .body,
.sop-content .caution .body {
  padding: 9px;
}
.sop-content ul.dash {
  list-style: none;
  margin: 6px 0;
  padding-left: 0;
}
.sop-content ul.dash li {
  position: relative;
  margin: 6px 0;
  padding-left: 18px;
}
.sop-content ul.dash li::before {
  content: "-";
  position: absolute;
  left: 0;
}
@media (max-width: 360px) {
  .app { padding-left: 9px; padding-right: 9px; }
  .controls { margin-left: -9px; margin-right: -9px; padding-left: 9px; padding-right: 9px; }
  h1 { font-size: 25px; }
  .label { font-size: 15px; }
  .action { font-size: 13px; }
}

/* ═══ DARK MODE ═══ */
:root { --transition: 160ms cubic-bezier(0.16,1,0.3,1); }
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111315; --surface: #1a1d20; --ink: #e8eaed; --muted: #8b929b;
  --line: #2e3338; --strong: #f0f2f5; --accent: #3ecfbc; --accent-2: #ff7b6a;
  --warning: #ffaa44; --ok: #4ecb71; --blue: #7b8fff;
  --shadow: 0 10px 28px rgba(0,0,0,.32);
}
[data-theme="dark"] .segmented { background: #22262a; }
[data-theme="dark"] .segmented input:checked + span { background: #3a3f45; }
[data-theme="dark"] select { background-color: #1a1d20; }
[data-theme="dark"] .item-card { background: var(--surface); }
[data-theme="dark"] .switch { background: #22262a; }
[data-theme="dark"] .switch::before { background: #3a3f45; }
[data-theme="dark"] .switch:has(input:checked)::before { background: var(--accent); }
[data-theme="dark"] .controls { background: rgba(17,19,21,.96); }
[data-theme="dark"] .reset-btn { background: #1a1d20; }
[data-theme="dark"] .sop-btn { background: #1c2a28; color: var(--accent); border-color: #2e4440; }
[data-theme="dark"] .shared-pill { background: #1c2a28; color: var(--accent); }
[data-theme="dark"] .role-pill { background: #22262a; color: var(--muted); }
[data-theme="dark"] .text-block { background: #1a1d20; }
[data-theme="dark"] .condition-block { background: #1a2235; }
[data-theme="dark"] .sop-sheet { background: #1a1d20; }
[data-theme="dark"] .sop-close { background: #22262a; }
[data-theme="dark"] .sop-content h1 { background: #1a1d20; color: var(--strong); border-color: var(--muted); }
[data-theme="dark"] .sop-content .desc,
[data-theme="dark"] .sop-content .grey-box { background: #252830; color: #adb5c0; }
[data-theme="dark"] .sop-content .sop-line .role { border-left-color: #4a5260; color: #a0abb8; }
[data-theme="dark"] .empty { background: #1a1d20; border-color: #2e3338; }
[data-theme="dark"] .status { background: var(--surface); }
[data-theme="dark"] .phase-overview-item { background: #111315; }
[data-theme="dark"] .progress-bar-track { background: #2a2d32; }
[data-theme="dark"] .phase-overview-bar { background: #2a2d32; }
[data-theme="dark"] .quiz-option { background: #1a1d20; border-color: #2e3338; }
[data-theme="dark"] .quiz-option:hover:not(:disabled) { background: #1c2a28; }
[data-theme="dark"] .quiz-card { background: var(--surface); }
[data-theme="dark"] .mode-tabs { background: #22262a; }
[data-theme="dark"] .mode-tab.active { background: var(--surface); }
[data-theme="dark"] .learn-card { background: var(--surface); }
[data-theme="dark"] .learn-action-revealed { background: rgba(62,207,188,.06); }
[data-theme="dark"] .learn-action-hidden:hover { background: rgba(62,207,188,.05); }

/* ═══ DARK MODE TOGGLE ═══ */
header { position: relative; padding-right: 52px; }
.theme-btn {
  position: absolute; top: 6px; right: 2px;
  min-width: 40px; min-height: 40px;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); color: var(--muted); font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: color var(--transition), background var(--transition);
}
.theme-btn:hover { color: var(--strong); }

/* ═══ MODE TABS ═══ */
.mode-tabs {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 3px; padding: 3px;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: #e9edf2; margin-bottom: 8px;
}
.mode-tab {
  display: flex; align-items: center; justify-content: center; gap: 4px;
  min-height: 40px; border: none; border-radius: 6px;
  background: transparent; color: #3a424d;
  font-size: 12px; font-weight: 900; letter-spacing: .03em;
  cursor: pointer; transition: background var(--transition), color var(--transition);
}
.mode-tab.active { color: var(--strong); background: #fff; box-shadow: 0 2px 8px rgba(10,20,30,.12); }
.mode-tab svg { width: 13px; height: 13px; flex-shrink: 0; }

/* ═══ PROGRESS BAR ═══ */
.progress-wrap { margin-top: 6px; }
.progress-label {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 4px; font-size: 11px; font-weight: 800;
  color: var(--muted); letter-spacing: .04em; text-transform: uppercase;
}
.progress-label-pct { color: var(--accent); font-weight: 950; }
.progress-bar-track { height: 6px; border-radius: 999px; background: #dde2e9; overflow: hidden; }
.progress-bar-fill { height: 100%; border-radius: 999px; background: var(--accent); transition: width .5s cubic-bezier(0.16,1,0.3,1); }

/* ═══ PHASE OVERVIEW ═══ */
.phase-overview { margin-top: 8px; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.phase-overview-title { font-size: 11px; font-weight: 900; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 10px; }
.phase-overview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px; }
.phase-overview-item {
  padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); cursor: pointer;
  transition: border-color .2s, transform .15s;
}
.phase-overview-item:active { transform: scale(.97); }
.phase-overview-item:hover { border-color: var(--accent); }
.phase-overview-name { font-size: 11px; font-weight: 900; color: var(--strong); margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.phase-overview-bar { height: 4px; border-radius: 999px; background: #dde2e9; overflow: hidden; }
.phase-overview-fill { height: 100%; border-radius: 999px; background: var(--ok); transition: width .4s; }
.phase-overview-pct { font-size: 10px; font-weight: 900; color: var(--muted); margin-top: 3px; }

/* ═══ LEARN MODE ═══ */
.learn-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.learn-counter { font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.learn-all-done { text-align: center; padding: 32px 14px; }
.learn-all-done .checkmark { font-size: 40px; margin-bottom: 8px; }
.learn-all-done p { color: var(--muted); font-size: 14px; font-weight: 800; margin-bottom: 16px; }
.learn-restart-btn { padding: 0 22px; min-height: 44px; border: none; border-radius: var(--radius); background: var(--accent); color: #fff; font-size: 14px; font-weight: 950; cursor: pointer; }

.learn-card {
  margin: 8px 0; border: 1.5px solid var(--line); border-radius: var(--radius);
  background: var(--surface); overflow: hidden;
  transition: border-color .2s;
}
.learn-card.revealed { border-color: var(--accent); }
.learn-card-top { padding: 12px 12px 10px; }
.learn-pill-row { margin-bottom: 6px; }
.learn-label { color: var(--strong); font-size: 16px; font-weight: 900; letter-spacing: .015em; line-height: 1.2; }
.learn-note { color: var(--muted); font-size: 13px; font-weight: 750; line-height: 1.35; margin-bottom: 5px; }

.learn-action-hidden {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 42px; padding: 8px 12px;
  border-top: 1px dashed var(--line);
  color: var(--muted); font-size: 13px; font-weight: 800; letter-spacing: .05em;
  cursor: pointer; transition: background var(--transition); user-select: none;
}
.learn-action-hidden:hover { background: rgba(0,107,95,.05); }
.learn-action-hidden svg { width: 14px; height: 14px; opacity: .6; flex-shrink: 0; }

.learn-action-revealed {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 12px; border-top: 1px solid rgba(0,107,95,.2);
  background: rgba(0,107,95,.05);
}
[data-theme="dark"] .learn-action-revealed { background: rgba(62,207,188,.06); border-top-color: rgba(62,207,188,.2); }
.learn-action-text { color: var(--accent); font-size: 15px; font-weight: 950; letter-spacing: .02em; }
.learn-buttons { display: flex; gap: 6px; }
.learn-btn {
  min-width: 44px; min-height: 32px; padding: 0 12px;
  border: 1.5px solid var(--line); border-radius: 999px;
  font-size: 12px; font-weight: 950; letter-spacing: .04em;
  cursor: pointer; transition: background var(--transition), border-color var(--transition);
  background: transparent;
}
.learn-btn.knew { border-color: var(--ok); color: var(--ok); }
.learn-btn.knew:hover { background: rgba(20,144,0,.08); }
.learn-btn.review { border-color: var(--accent-2); color: var(--accent-2); }
.learn-btn.review:hover { background: rgba(198,65,47,.08); }
.learn-sop-link { font-size: 11px; font-weight: 900; color: var(--accent); opacity: .7; text-decoration: none; background: none; border: none; cursor: pointer; padding: 0; letter-spacing: .04em; }

/* ═══ REIHENFOLGE MODE ═══ */
.order-hint {
  margin: 6px 0 12px; color: var(--muted); font-size: 13px; font-weight: 800;
  line-height: 1.4;
}
.order-board {
  display: flex; flex-direction: column; gap: 10px;
}
.order-card {
  display: grid;
  grid-template-columns: 26px 30px 1fr;
  gap: 8px;
  align-items: center;
  padding: 12px 14px 12px 10px;
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: 0 2px 8px rgba(10,20,30,.07), 0 1px 2px rgba(10,20,30,.05);
  user-select: none; -webkit-user-select: none;
  touch-action: auto;
  will-change: transform;
  position: relative;
}
.order-card.correct {
  border-color: var(--ok);
  background: rgba(20,144,0,.05);
}
.order-card.wrong {
  border-color: var(--accent-2);
  background: rgba(198,65,47,.05);
}
.order-index {
  width: 24px; height: 24px; border-radius: 999px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,107,95,.1); color: var(--accent);
  font-size: 12px; font-weight: 950; flex-shrink: 0;
}
.order-drag-icon {
  display: flex; align-items: center; justify-content: center;
  color: var(--muted); font-size: 20px; line-height: 1;
  min-height: 44px; flex-shrink: 0;
}
.order-body { min-width: 0; }
.order-body .task-line {
  display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; align-items: end;
}
.order-body .label { font-size: 15px; font-weight: 900; color: var(--strong); line-height: 1.2; }
.order-body .action { font-size: 13px; font-weight: 900; color: var(--strong); text-align: right; }
.order-actions {
  display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap;
}
.order-check-btn {
  flex: 1; min-height: 46px; border: none; border-radius: var(--radius);
  background: var(--accent); color: #fff; font-size: 15px; font-weight: 950; cursor: pointer;
}
.order-reset-btn {
  min-height: 46px; padding: 0 14px; border: 1.5px solid var(--line); border-radius: var(--radius);
  background: transparent; color: var(--strong); font-size: 14px; font-weight: 900; cursor: pointer;
}
.order-success {
  margin-top: 12px; padding: 14px; border-radius: var(--radius);
  border: 1.5px solid var(--ok); background: rgba(20,144,0,.07);
  color: var(--ok); font-size: 14px; font-weight: 900; text-align: center;
}
.order-wrong-msg {
  margin-top: 12px; padding: 14px; border-radius: var(--radius);
  border: 1.5px solid var(--accent-2); background: rgba(198,65,47,.06);
  color: var(--accent-2); font-size: 14px; font-weight: 900; text-align: center;
}

<section class="page" id="preliminary-cockpit-preparation">
<h1>Preliminary Cockpit Preparation</h1>

<h1>General</h1>
<p>Items marked by asterisks (*) are the only steps to be completed after a transit stop without flight crew change. Otherwise, the new flight crew performs all the items.</p>
<p>The flight crew performs the preliminary cockpit preparation to ensure that all required safety checks are completed.</p>
<p>The safety checks prevent the inadvertent operation of aircraft systems, danger to the aircraft, and danger to the personnel.</p>

<h1>Aircraft Setup</h1>
<h2>GENERAL</h2>
<div class="warning"><div class="tag">Warning:</div><div class="body">Do not pressurize the hydraulic systems until clearance is obtained from ground personnel.</div></div>
<h2>ENG</h2>
<div class="sop-line"><span class="label">ENG 1, 2 MASTER LEVERS</span><span class="dots"></span><span class="action">OFF</span><span class="role">CM2</span></div>
<div class="sop-line"><span class="label">ENG MODE selector</span><span class="dots"></span><span class="action">NORM</span><span class="role">CM2</span></div>
<h2>WEATHER RADAR</h2>
<div class="sop-line"><span class="label">*RADAR sw</span><span class="dots"></span><span class="action">OFF</span><span class="role">CM2</span></div>
<div class="sop-line"><span class="label">*WINDSHEAR / PWS sw</span><span class="dots"></span><span class="action">OFF</span><span class="role">CM2</span></div>
<div class="sop-line"><span class="label">*GAIN knob</span><span class="dots"></span><span class="action">AUTO/CAL</span><span class="role">CM2</span></div>
<div class="sop-line"><span class="label">*MODE selector</span><span class="dots"></span><span class="action">AS RQRD</span><span class="role">CM2</span></div>
<h2>L/G</h2>
<div class="sop-line"><span class="label">L/G lever</span><span class="dots"></span><span class="action">DOWN</span><span class="role">CM2</span></div>
<h2>WIPERS</h2>
<div class="sop-line"><span class="label">Both WIPER selectors</span><span class="dots"></span><span class="action">OFF</span><span class="role">CM2</span></div>

<h1>Batteries Check/External Power</h1>
<div class="tree">
<p><strong>If the aircraft has not been electrically supplied for 6 h or more, perform the following check:</strong></p>
<div class="sop-line"><span class="label">BAT 1 pb-sw and BAT 2 pb-sw</span><span class="dots"></span><span class="action">CHECK OFF</span><span class="role">CM2</span></div>
<div class="sop-line"><span class="label">BAT 1 and 2 VOLTAGE</span><span class="dots"></span><span class="action">CHECK ABOVE 25.5 V</span><span class="role">CM2</span></div>
<div class="desc">Battery voltage above 25.5 V ensures a charge above 50 %.</div>
<div class="tree">
<p><strong>If the battery voltage is at or below 25.5 V:</strong><br>A charging cycle of about 20 min is required.</p>
<div class="sop-line"><span class="label">BAT 1 pb-sw and BAT 2 pb-sw</span><span class="dots"></span><span class="action">AUTO</span><span class="role">CM2</span></div>
<div class="sop-line"><span class="label">EXT PWR pb-sw</span><span class="dots"></span><span class="action">ON</span><span class="role">CM2</span></div>
<div class="desc">Check on ELEC SD Page, that the battery contactor is closed and the batteries are charging.</div>
<div class="tree">
<p><strong>After 20 min:</strong></p>
<div class="sop-line"><span class="label">BAT 1 pb-sw and BAT 2 pb-sw</span><span class="dots"></span><span class="action">OFF</span><span class="role">CM2</span></div>
<div class="sop-line"><span class="label">BAT 1 and 2 VOLTAGE</span><span class="dots"></span><span class="action">CHECK ABOVE 25.5 V</span><span class="role">CM2</span></div>
<div class="sop-line"><span class="label">BAT 1 pb-sw and BAT 2 pb-sw</span><span class="dots"></span><span class="action">AUTO</span><span class="role">CM2</span></div>
</div></div>
<div class="tree">
<p><strong>If the battery voltage is above 25.5 V:</strong></p>
<div class="sop-line"><span class="label">BAT 1 pb-sw and BAT 2 pb-sw</span><span class="dots"></span><span class="action">AUTO</span><span class="role">CM2</span></div>
<div class="desc">If the APU is started on batteries only, it should be started within 30 min after the selection of batteries to AUTO.</div>
</div></div>
<div class="tree">
<p><strong>If the aircraft has been electrically supplied during the last 6 h:</strong></p>
<div class="sop-line"><span class="label">BAT 1 pb-sw and BAT 2 pb-sw</span><span class="dots"></span><span class="action">AUTO</span><span class="role">CM2</span></div>
<p><strong>If the <span class="green">AVAIL</span> light is on:</strong></p>
<div class="sop-line"><span class="label">EXT PWR pb-sw</span><span class="dots"></span><span class="action">ON</span><span class="role">CM2</span></div>
</div>

<h1>APU Fire Test/APU Start</h1>
<h2>RMP</h2>
<div class="sop-line"><span class="label">RMP 1 and 2</span><span class="dots"></span><span class="action">CHECK ON</span><span class="role">CM2</span></div>
<div class="sop-line"><span class="label">Green NAV light</span><span class="dots"></span><span class="action">CHECK OFF</span><span class="role">CM2</span></div>
<div class="sop-line"><span class="label">COM FREQUENCIES</span><span class="dots"></span><span class="action">TUNE</span><span class="role">CM2</span></div>
<div class="desc">Use VHF 1 for ATC, VHF 2 for ATIS and company frequencies. VHF 3 is normally devoted to ACARS.</div>
<h2>ACP</h2>
<div class="sop-line"><span class="label">INT knob</span><span class="dots"></span><span class="action">PRESS OUT/VOLUME CHECK</span><span class="role">CM2</span></div>
<div class="desc">Ensure that INT volume is turned up, to enable contact with the ground crew.</div>
<div class="sop-line"><span class="label">VHF</span><span class="dots"></span><span class="action">CHECK</span><span class="role">CM2</span></div>
<div class="desc">Check transmission and reception.</div>
<div class="sop-line"><span class="label">HF, if required for flight</span><span class="dots"></span><span class="action">CHECK</span><span class="role">CM2</span></div>
<div class="desc">Check transmission and reception.</div>
<div class="caution"><div class="tag">Caution:</div><div class="body"><ul class='dash'><li>Do not transmit on HF during refueling operations.</li><li>Only perform HF radio checks when appropriate.</li></ul></div></div>
<h2>APU FIRE</h2>
<div class="warning"><div class="tag">Warning:</div><div class="body">The automatic shutdown of the APU and the discharge of the APU fire extinguisher bottle may occur if the flight crew presses the APU FIRE test pb for more than 3 seconds.</div></div>
<div class="sop-line"><span class="label">APU FIRE pb-sw</span><span class="dots"></span><span class="action">CHECK IN and GUARDED</span><span class="role">CM2</span></div>
<div class="sop-line"><span class="label">APU AGENT light</span><span class="dots"></span><span class="action">CHECK OFF</span><span class="role">CM2</span></div>
<div class="sop-line"><span class="label">APU FIRE TEST pb</span><span class="dots"></span><span class="action">PRESS and MAINTAIN</span><span class="role">CM2</span></div>
<h2>TEST RESULT</h2>
<p>Check that the APU fire detection and extinguishing system is operative:</p>
<ul class="dash">
<li><span class="red">APU FIRE</span> warning on, if AC power available: ECAM, CRC, MASTER WARN light</li>
<li>APU <span class="red">FIRE</span> pb-sw lighted red</li>
<li>SQUIB light and <span class="orange">DISCH</span> light on</li>
</ul>
<h2>APU START</h2>
<div class="tree">
<p><strong>If the EXT PWR pb light is ON:</strong></p>
<div class="sop-line"><span class="label">APU MASTER SW pb-sw</span><span class="dots"></span><span class="action">ON</span><span class="role">CM2</span></div>
<div class="sop-line"><span class="label">APU START pb-sw</span><span class="dots"></span><span class="action">ON</span><span class="role">CM2</span></div>
<div class="note">Note: Wait at least 3 s before selecting APU START pb-sw.</div>
<div class="sop-line"><span class="label">*EXT PWR pb</span><span class="dots"></span><span class="action">AS RQRD</span><span class="role">CM2</span></div>
<div class="desc">The flight crew should keep ON the external power units to reduce the APU load, particularly in hot weather conditions.</div>
</div>
<div class="tree">
<p><strong>When the APU is <span class="green">AVAIL</span>:</strong></p>
<div class="sop-line"><span class="label">APU BLEED pb-sw</span><span class="dots"></span><span class="action">ON</span><span class="role">CM2</span></div>
<div class="desc">Do not use APU BLEED, if the ground personnel confirms that a LP or HP ground air unit is connected to the aircraft.</div>
<div class="sop-line"><span class="label">X BLEED selector</span><span class="dots"></span><span class="action">AUTO</span><span class="role">CM2</span></div>
<div class="sop-line"><span class="label">COCKPIT TEMP rotary selector and CABIN TEMP rotary selector</span><span class="dots"></span><span class="action">AS RQRD</span><span class="role">CM2</span></div>
<div class="desc">Full range temperature 24 ± 6 °C.</div>
</div>

<h1>ADIRS</h1>
<h2>ADIRS</h2>
<div class="sop-line"><span class="label">*All IR MODE selectors</span><span class="dots"></span><span class="action">NAV</span><span class="role">CM2</span></div>
<div class="desc">Align or realign IRS as appropriate.</div>
<div class="grey-box">
<p>A complete IRS alignment must be performed in the following cases:</p>
<ul class="dash"><li>Before the first flight of the day</li><li>When there is a crew change</li><li>When the departure airport is located between latitudes 2° north and 2° south</li><li>When the GPS is not available and NAVAID coverage is poor</li><li>When GPS is not available and expected flight time is more than 3 h.</li></ul>
</div>

<h1>Cockpit Lights</h1>
<h2>COCKPIT LIGHTS</h2>
<div class="sop-line"><span class="label">*COCKPIT LIGHTS</span><span class="dots"></span><span class="action">AS RQRD</span><span class="role">CM1-CM2</span></div>
<div class="desc">Set INT LT, FLOOD LT, INTEG LT, including glareshield and FCU.</div>

<h1>EFB/ACARS (If Installed) Initialization</h1>
<h2>EFB Start</h2>
<div class="sop-line"><span class="label">ALL EFB</span><span class="dots"></span><span class="action">START</span><span class="role">CM1-CM2</span></div>
<div class="tree">
<p><strong>In accordance with the Operator's policy or if required by operational regulation:</strong></p>
<div class="sop-line"><span class="label">EFB Version and Database</span><span class="dots"></span><span class="action">CHECK</span><span class="role">CM1-CM2</span></div>
<div class="desc">Check that all EFB software versions and associated databases are in accordance with the reference authorized by the EFB Administrator.</div>
</div>
<h2>FMGS Pre-Initialization</h2>
<p>Perform FMGS Pre-Initialization in the case of ACARS/AOC operations or EFB operations when synchronization with the avionics is available.</p>
<div class="sop-line"><span class="label">*ENGINE & AIRCRAFT TYPE</span><span class="dots"></span><span class="action">CHECK</span><span class="role">CM1-CM2</span></div>
<div class="sop-line"><span class="label">*FM database validity</span><span class="dots"></span><span class="action">CHECK</span><span class="role">CM1-CM2</span></div>
<div class="sop-line"><span class="label">*FLIGHT PLAN INITIALIZATION</span><span class="dots"></span><span class="action">START</span><span class="role">PF</span></div>
<div class="grey-box"><ul class="dash"><li>Press the INIT key</li><li>Enter flight number</li><li>Insert FROM/TO</li><li>Check date</li><li>Press SEND</li><li>Wait until route-uplink message has been displayed in FMS scratchpad.</li></ul></div>
<h2>EFB INITIALIZATION</h2>
<div class="sop-line"><span class="label">*EFB</span><span class="dots"></span><span class="action">INITIALIZE</span><span class="role">CM1-CM2</span></div>
<div class="grey-box"><p>Check the EFB initialization:</p><ul class="dash"><li>ACFT TYPE and ACFT REG</li><li>FLT NBR and FROM/TO in agreement with the FMS INIT A page.</li></ul></div>

<h1>Aircraft Acceptance</h1>
<div class="sop-line"><span class="label">*RCL pb</span><span class="dots"></span><span class="action">PRESS 3 s</span><span class="role">CM1</span></div>
<div class="desc">This action recalls all warnings that the flight crew cleared or cancelled during the last flight.</div>
<div class="sop-line"><span class="label">*LOGBOOK AND MEL/CDL ITEMS</span><span class="dots"></span><span class="action">CHECK</span><span class="role">BOTH</span></div>
<div class="sop-line"><span class="label">AIRCRAFT CONFIGURATION SUMMARY</span><span class="dots"></span><span class="action">CHECK</span><span class="role">BOTH</span></div>
<div class="sop-line"><span class="label">*OEB</span><span class="dots"></span><span class="action">CHECK</span><span class="role">BOTH</span></div>
<div class="sop-line"><span class="label">*AIRCRAFT ACCEPTANCE</span><span class="dots"></span><span class="action">PERFORM</span><span class="role">CM1</span></div>
<div class="note">Note: The aircraft acceptance can be performed later, but must be completed at the end of the Cockpit Preparation.</div>

<h1>Preliminary Performance Determination</h1>
<p>Each flight crewmember independently computes preliminary performance data in accordance with aircraft technical condition and other criteria affecting aircraft performance.</p>
<div class="sop-line"><span class="label">*AIRFIELD DATA</span><span class="dots"></span><span class="action">OBTAIN</span><span class="role">CM1-CM2</span></div>
<div class="desc">Obtain data needed for initializing the system, preparing the cockpit and preliminary takeoff performance computation.</div>
<div class="tree"><p><strong>If an EFB application for load and trim sheet is used:</strong></p><div class="sop-line"><span class="label">*PRELIMINARY LOADING</span><span class="dots"></span><span class="action">COMPUTE AND CROSSCHECK</span><span class="role">CM1-CM2</span></div></div>
<div class="tree"><p><strong>If dispatch under MEL or CDL and in accordance with the logbook:</strong></p><div class="sop-line"><span class="label">*MEL/CDL ITEMS</span><span class="dots"></span><span class="action">CHECK</span><span class="role">CM1-CM2</span></div></div>
<div class="sop-line"><span class="label">*NAVIGATION CHARTS</span><span class="dots"></span><span class="action">PREPARE</span><span class="role">BOTH</span></div>
<div class="sop-line"><span class="label">*PRELIMINARY TAKEOFF PERF DATA</span><span class="dots"></span><span class="action">COMPUTE</span><span class="role">CM1-CM2</span></div>
<div class="grey-box"><p>Both flight crewmembers discuss and decide: runway, intersection, flap setting, anti-ice, packs and takeoff thrust setting options.</p></div>
<div class="sop-line"><span class="label">*PRELIMINARY TAKEOFF PERF DATA</span><span class="dots"></span><span class="action">CROSSCHECK</span><span class="role">BOTH</span></div>

<h1>Before Walkaround</h1>
<h2>ECAM Pages</h2>
<div class="tree"><p><strong>On the DOOR SD Page:</strong></p><div class="sop-line"><span class="label">*OXY</span><span class="dots"></span><span class="action">CHECK PRESSURE</span><span class="role">PM</span></div></div>
<div class="tree"><p><strong>On the HYD SD Page:</strong></p><div class="sop-line"><span class="label">*RESERVOIR FLUID LEVEL</span><span class="dots"></span><span class="action">CHECK WITHIN NORMAL RANGE</span><span class="role">PM</span></div></div>
<div class="tree"><p><strong>On the ENG SD Page:</strong></p><div class="sop-line"><span class="label">*ENG OIL QUANTITY</span><span class="dots"></span><span class="action">CHECK</span><span class="role">PM</span></div></div>
<h2>F/CTL</h2>
<div class="sop-line"><span class="label">FLAPS</span><span class="dots"></span><span class="action">CHECK POSITION</span><span class="role">PM</span></div>
<div class="sop-line"><span class="label">*SPEEDBRAKE lever</span><span class="dots"></span><span class="action">CHECK RETRACTED and DISARMED</span><span class="role">PM</span></div>
<div class="warning"><div class="tag">Warning:</div><div class="body">If flight control surface positions do not agree with the control handle positions, check with the maintenance crew before applying hydraulic power.</div></div>
<h2>PARKING BRAKE</h2>
<div class="sop-line"><span class="label">*ACCU PRESS indicator</span><span class="dots"></span><span class="action">CHECK</span><span class="role">PM</span></div>
<div class="sop-line"><span class="label">*PARK BRK handle</span><span class="dots"></span><span class="action">AS RQRD</span><span class="role">PM</span></div>
<div class="sop-line"><span class="label">*BRAKES PRESS indicator</span><span class="dots"></span><span class="action">CHECK</span><span class="role">PM</span></div>
<h2>ALTERNATE BRAKING SYSTEM</h2>
<div class="sop-line"><span class="label">Y ELEC PUMP pb-sw</span><span class="dots"></span><span class="action">CHECK OFF</span><span class="role">PM</span></div>
<div class="sop-line"><span class="label">CHOCKS</span><span class="dots"></span><span class="action">CHECK IN PLACE</span><span class="role">PM</span></div>
<div class="sop-line"><span class="label">PARK BRK handle</span><span class="dots"></span><span class="action">OFF</span><span class="role">PM</span></div>
<div class="sop-line"><span class="label">BRAKE PEDALS</span><span class="dots"></span><span class="action">PRESS</span><span class="role">PM</span></div>
<div class="sop-line"><span class="label">BRAKE PRESSURE</span><span class="dots"></span><span class="action">CHECK</span><span class="role">PM</span></div>
<div class="sop-line"><span class="label">BRAKE PEDALS</span><span class="dots"></span><span class="action">RELEASE</span><span class="role">PM</span></div>
<div class="sop-line"><span class="label">PARK BRK handle</span><span class="dots"></span><span class="action">AS RQRD</span><span class="role">PM</span></div>
<h2>EMERGENCY EQUIPMENT</h2>
<div class="sop-line"><span class="label">EMER EQPT</span><span class="dots"></span><span class="action">CHECK</span><span class="role">PM</span></div>
<div class="grey-box"><p>Check life vests, crash axe, PBE, portable fire extinguisher, smoke goggles, oxygen masks, flashlights, escape ropes and Lithium Safe Bag are stowed/ready as applicable.</p></div>
<h2>RAIN REPELLENT</h2>
<div class="sop-line"><span class="label">RAIN RPLNT indicators</span><span class="dots"></span><span class="action">CHECK PRESSURE and QUANTITY</span><span class="role">PM</span></div>
<div class="caution"><div class="tag">Caution:</div><div class="body">Never use rain repellent to wash the windshield and never use it on a dry windshield.</div></div>
<h2>REAR and OVERHEAD CIRCUIT BREAKERS Panels</h2>
<div class="sop-line"><span class="label">REAR and OVERHEAD CIRCUIT BREAKERS panels</span><span class="dots"></span><span class="action">CHECK</span><span class="role">PM</span></div>
<h2>LANDING GEAR PINS and COVERS</h2>
<div class="sop-line"><span class="label">*GEAR PINS</span><span class="dots"></span><span class="action">CHECK ONBOARD and STOWED</span><span class="role">PM</span></div>
</section>

<section class="page" id="cockpit-preparation">
<h1>Cockpit Preparation</h1>
<h1>General</h1>
<p>Items marked by asterisks (*) are the only steps to be completed after a transit stop without flight crew change. Otherwise, the new flight crew performs all the items.</p>
<p>The PF and PM perform the cockpit preparation in accordance with the defined panel scan sequence and tasksharing.</p>
<p>The PF prepares the overhead panel, center instrument panel and pedestal while the PM performs the external walkaround. When both flight crewmembers are seated and the PM has checked the FMS, both flight crewmembers continue the cockpit preparation.</p>
<div class="warning"><div class="tag">Warning:</div><div class="body">Do not pressurize the hydraulic systems until clearance is obtained from ground personnel.</div></div>

<h1>Overhead Panel</h1>
<h2>WHITE LIGHTS ON THE OVERHEAD PANEL</h2>
<div class="tree"><p><strong>As a general rule, during the scan sequence of the overhead panel:</strong></p><div class="sop-line"><span class="label">*ALL WHITE LIGHTS, except MAINTENANCE panel</span><span class="dots"></span><span class="action">OFF</span><span class="role">PF</span></div></div>
<h2>RCDR</h2>
<div class="sop-line"><span class="label">*RCDR GND CTL pb-sw</span><span class="dots"></span><span class="action">ON</span><span class="role">PF</span></div>
<div class="sop-line"><span class="label">LOUDSPEAKER VOLUME knob</span><span class="dots"></span><span class="action">OFF, BOTH SIDES</span><span class="role">PF</span></div>
<div class="sop-line"><span class="label">ACP INT/RAD sw, ACP1 and ACP2</span><span class="dots"></span><span class="action">SET to INT</span><span class="role">PF</span></div>
<div class="sop-line"><span class="label">INTERPHONE VOLUME RECEPTION knob, ACP1 and ACP2</span><span class="dots"></span><span class="action">RELEASE</span><span class="role">PF</span></div>
<div class="sop-line"><span class="label">CVR TEST pb</span><span class="dots"></span><span class="action">PRESS AND MAINTAIN</span><span class="role">PF</span></div>
<div class="desc">The CVR test is successful when an audio test signal is heard through the loudspeakers while the CVR TEST pb is pressed and maintained.</div>
<h2>EVAC</h2>
<div class="sop-line"><span class="label">CAPT & PURS/CAPT sw</span><span class="dots"></span><span class="action">CAPT & PURS</span><span class="role">PF</span></div>
<h2>EXTERIOR LIGHTS</h2>
<div class="sop-line"><span class="label">STROBE sw</span><span class="dots"></span><span class="action">AUTO</span><span class="role">PF</span></div>
<div class="sop-line"><span class="label">BEACON sw</span><span class="dots"></span><span class="action">OFF</span><span class="role">PF</span></div>
<div class="sop-line"><span class="label">NAV & LOGO sw</span><span class="dots"></span><span class="action">AS RQRD</span><span class="role">PF</span></div>
<div class="sop-line"><span class="label">REMAINING EXTERIOR LIGHTS</span><span class="dots"></span><span class="action">AS RQRD</span><span class="role">PF</span></div>
<h2>SIGNS</h2>
<div class="sop-line"><span class="label">*SIGNS panel</span><span class="dots"></span><span class="action">SET</span><span class="role">PF</span></div>
<div class="grey-box"><ul class="dash"><li>Set the SEAT BELTS sw to ON earliest when refueling is complete.</li><li>Set the EMER EXIT LT sw to ARM.</li><li>Set the NO SMOKING sw to AUTO.</li></ul></div>
<h2>PROBE/WINDOW HEAT</h2>
<div class="sop-line"><span class="label">PROBE/WINDOW HEAT pb-sw</span><span class="dots"></span><span class="action">AUTO</span><span class="role">PF</span></div>
<h2>CABIN PRESS</h2>
<div class="sop-line"><span class="label">LDG ELEV knob</span><span class="dots"></span><span class="action">AUTO</span><span class="role">PF</span></div>
<h2>AIR COND</h2>
<div class="sop-line"><span class="label">*PACK FLOW selector</span><span class="dots"></span><span class="action">AS RQRD</span><span class="role">PF</span></div>
<div class="grey-box"><p>Select LO if occupants below 141, HI for abnormally hot and humid conditions, NORM for all other normal cases.</p></div>
<h2>ELEC</h2>
<div class="sop-line"><span class="label">ELEC pb, on ECAM Control Panel</span><span class="dots"></span><span class="action">PRESS</span><span class="role">PF</span></div>
<div class="sop-line"><span class="label">BAT 1 pb-sw and BAT 2 pb-sw</span><span class="dots"></span><span class="action">OFF then AUTO</span><span class="role">PF</span></div>
<div class="desc">This action initiates a charging cycle of the batteries. 10 s after setting all BAT pb-sw to AUTO, check on the ELEC SD Page that the current charge is below 60 A and decreasing.</div>
<h2>FUEL</h2>
<div class="tree"><p><strong>If the center tank is less than 200 kg for the flight:</strong></p><div class="sop-line"><span class="label">*FUEL CTR TK MODE SEL pb-sw</span><span class="dots"></span><span class="action">MAN</span><span class="role">PF</span></div><div class="sop-line"><span class="label">*CTR TK PUMP 1 pb-sw and CTR TK PUMP 2 pb-sw</span><span class="dots"></span><span class="action">OFF</span><span class="role">PF</span></div></div>
<div class="tree"><p><strong>If the center tank is not less than 200 kg for the flight:</strong></p><div class="sop-line"><span class="label">*FUEL CTR TK MODE SEL pb</span><span class="dots"></span><span class="action">CHECK AUTO</span><span class="role">PF</span></div></div>
<h2>ENG 1 - ENG 2 FIRE</h2>
<div class="sop-line"><span class="label">ENG 1 FIRE pb-sw and ENG 2 FIRE pb-sw</span><span class="dots"></span><span class="action">CHECK IN and GUARDED</span><span class="role">PF</span></div>
<div class="sop-line"><span class="label">AGENT 1 light and AGENT 2 light</span><span class="dots"></span><span class="action">CHECK OFF</span><span class="role">PF</span></div>
<div class="sop-line"><span class="label">ENG 1 TEST pb</span><span class="dots"></span><span class="action">PRESS and MAINTAIN</span><span class="role">PF</span></div>
<div class="sop-line"><span class="label">ENG 2 TEST pb</span><span class="dots"></span><span class="action">PRESS and MAINTAIN</span><span class="role">PF</span></div>
<h3>TEST RESULT</h3>
<ul class="dash"><li>CRC sounds</li><li>MASTER WARN lights flash</li><li>ECAM displays ENG 1 FIRE and ENG 2 FIRE alerts</li><li>All ENG FIRE pb-sw come on red</li><li>All SQUIB and DISCH lights come on.</li></ul>

  /* ── Parse source ── */
  function extractItemsFromCell(cell, owner) {
    const items = [];
    const pendingNotes = [];
    Array.from(cell.children).forEach(child => {
      if (child.classList.contains('wide-note') || child.classList.contains('note')) {
        const note = clean(child.textContent);
        if (note) pendingNotes.push(child.innerHTML.trim());
        return;
      }
      if (!child.classList.contains('item')) return;
      const labelEl  = child.querySelector('.label');
      const actionEl = child.querySelector('.action');
      if (!labelEl || !actionEl) return;
      const plainLabel  = clean(labelEl.textContent);
      const plainAction = clean(actionEl.textContent);
      const textKey = normalize(plainLabel);
      const isStarred = /^\*/.test(plainLabel);
      items.push({
        type:'item', owner, plainLabel, plainAction, textKey, isStarred,
        label: labelEl.innerHTML.trim(), action: actionEl.innerHTML.trim(),
        notes: [...pendingNotes]
      });
      pendingNotes.length = 0;
    });
    return items;
  }

  function attachConditionalGroups(blocks) {
    let conditionCounter = 0;
    let activeCondition = null;
    blocks.forEach(block => {
      if (block.type === 'text' && isYesNoCondition(block.html.replace(/<[^>]*>/g,''))) {
        conditionCounter += 1;
        block.isCondition = true;
        block.conditionId = 'cond-' + conditionCounter;
        activeCondition = block.conditionId;
      } else if (block.type === 'text') {
        activeCondition = null;
      }
      if (block.type === 'item' && activeCondition) block.conditionId = activeCondition;
    });
    return blocks;
  }

  function parseSource() {
    return Array.from(source.content.querySelectorAll('main.page')).map((page, phaseIndex) => {
      const title = clean(page.querySelector('h1')?.textContent || 'Phase ' + (phaseIndex+1));
      const blocks = [];
      let currentSection = '';
      Array.from(page.children).forEach(node => {
        if (node.matches?.('h1')) return;
        if (node.classList?.contains('section-title')) { currentSection = clean(node.textContent); return; }
        if (node.matches?.('table.checklist')) {
          const headers = Array.from(node.querySelectorAll('thead th')).map(th => clean(th.textContent));
          const axis = headers.includes('CM1') || headers.includes('CM2') ? 'crewRole' : 'flightFunction';
          Array.from(node.querySelectorAll('tbody tr')).forEach((row, rowIndex) => {
            Array.from(row.children).forEach((cell, cellIndex) => {
              const shared = cell.colSpan === 2;
              const owner  = shared ? 'ALL' : headers[cellIndex];
              extractItemsFromCell(cell, owner).forEach((entry, entryIndex) => {
                const id = hash([title, currentSection, axis, rowIndex, cellIndex, entryIndex, entry.textKey].join('|'));
                blocks.push({...entry, id, title, section: currentSection, axis, shared});
              });
            });
          });
        } else {
          const html = node.innerHTML?.trim() || '';
          if (html) blocks.push({ type:'text', html, notes:[], title, section: currentSection });
        }
      });
      return { title, blocks: attachConditionalGroups(blocks) };
    });
  }

  const phases = parseSource();
  phases.forEach((phase, index) => {
    const opt = document.createElement('option');
    opt.value = String(index); opt.textContent = phase.title;
    phaseSelect.appendChild(opt);
  });

  /* ── Visibility ── */
  function isRelevant(block, state) {
    if (block.shared || block.owner === 'ALL') return true;
    if (block.axis === 'crewRole') return block.owner === state.crewRole;
    return block.owner === state.flightFunction;
  }
  function passesTransitFilter(block, state) {
    return !state.transitOnly || block.type !== 'item' || block.isStarred;
  }
  function isConditionEnabled(block, state) {
    return !block.conditionId || localStorage.getItem(conditionKeyFor(state, block.conditionId)) === '1';
  }
  function hasVisibleConditionItems(blocks, conditionId, state) {
    return blocks.some(b => b.type==='item' && b.conditionId===conditionId && isRelevant(b,state) && passesTransitFilter(b,state));
  }
  function isVisibleBlock(block, blocks, state) {
    if (!isRelevant(block, state)) return false;
    if (block.isCondition) return hasVisibleConditionItems(blocks, block.conditionId, state);
    if (!passesTransitFilter(block, state)) return false;
    if (block.type==='item' && !isConditionEnabled(block, state)) return false;
    return true;
  }

  /* ── Learn state helpers ── */
  function getLearnStatus(state, item) {
    return localStorage.getItem(learnKeyFor(state, item)); // null | 'knew' | 'review'
  }
  function setLearnStatus(state, item, val) {
    if (val) localStorage.setItem(learnKeyFor(state, item), val);
    else localStorage.removeItem(learnKeyFor(state, item));
  }
  function learnProgressForPhase(phaseIndex, state) {
    const phase = phases[phaseIndex];
    const tempState = {...state, phase: String(phaseIndex)};
    const visible = phase.blocks.filter(b => b.type==='item' && isVisibleBlock(b, phase.blocks, tempState));
    const known   = visible.filter(b => getLearnStatus(tempState, b) === 'knew').length;
    return { total: visible.length, known };
  }

  /* ── SOP helpers (unchanged) ── */
  function resolveSopTargets(block) {
    if (block.type !== 'item') return [];
    const labelKey = normalize(block.plainLabel || '');
    const itemKey  = [block.title, block.section, labelKey].join('|');
    if (Object.prototype.hasOwnProperty.call(SOP_ITEM_MAP, itemKey)) return SOP_ITEM_MAP[itemKey];
    return SOP_SECTION_MAP[[block.title, block.section].join('|')] || [];
  }
  function getSopSearchRoot(spec) {
    if (!spec.page) return sopSource.content;
    return sopSource.content.querySelector('section.page#'+spec.page) || sopSource.content;
  }
  function matchingHeading(root, selector, text) {
    return Array.from(root.querySelectorAll(selector)).find(h => clean(h.textContent) === text);
  }
  function cloneUntil(startNode, stopSelector) {
    const frag = document.createDocumentFragment();
    let node = startNode;
    while (node) {
      if (node !== startNode && node.matches?.(stopSelector)) break;
      frag.appendChild(node.cloneNode(true));
      node = node.nextElementSibling;
    }
    return frag;
  }
  function buildSopProcedure(spec) {
    const root = getSopSearchRoot(spec);
    const h1   = matchingHeading(root, 'h1', spec.h1);
    if (!h1) return null;
    const article = document.createElement('article');
    article.className = 'sop-procedure';
    if (!spec.h2) { article.appendChild(cloneUntil(h1,'h1')); return article; }
    article.appendChild(h1.cloneNode(true));
    let node = h1.nextElementSibling, h2 = null;
    while (node) {
      if (node.matches?.('h1')) break;
      if (node.matches?.('h2') && clean(node.textContent) === spec.h2) { h2 = node; break; }
      node = node.nextElementSibling;
    }
    if (!h2) return null;
    article.appendChild(cloneUntil(h2,'h1,h2'));
    return article;
  }
  function openSop(block, targets) {
    sopTitle.textContent = clean([block.section, block.plainLabel, block.plainAction].filter(Boolean).join(' · '));
    sopContent.innerHTML = '';
    targets.forEach(spec => {
      const proc = buildSopProcedure(spec);
      if (proc) sopContent.appendChild(proc);
    });
    if (!sopContent.children.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'Für diesen Punkt wurde kein SOP-Abschnitt gefunden.';
      sopContent.appendChild(empty);
    }
    sopOverlay.classList.add('open');
    sopOverlay.setAttribute('aria-hidden','false');
    document.body.style.overflow = 'hidden';
  }
  function closeSop() {
    sopOverlay.classList.remove('open');
    sopOverlay.setAttribute('aria-hidden','true');
    document.body.style.overflow = '';
  }

  /* ══════════════════════════════════════════════════════════
     RENDER REFERENCE MODE
  ══════════════════════════════════════════════════════════ */
  function renderRef(phase, relevant, state) {
    let currentSection = null, itemCount = 0, doneCount = 0;
    relevant.forEach(block => {
      if (block.section !== currentSection) {
        currentSection = block.section;
        if (currentSection) {
          const heading = document.createElement('div');
          heading.className = 'section-title'; heading.textContent = currentSection;
          checklist.appendChild(heading);
        }
      }
      if (block.type === 'item') {
        itemCount += 1;
        const storageKey = keyFor(state, block);
        const done = localStorage.getItem(storageKey) === '1';
        const sopTargets = resolveSopTargets(block);
        if (done) doneCount += 1;
        const card = document.createElement('div');
        card.className = 'item-card' + (done?' done':'') + (sopTargets.length?' has-sop':'');
        card.innerHTML =
          '<input class="check" type="checkbox" '+(done?'checked':'')+' aria-label="Punkt abhaken">' +
          '<div class="item-body">' +
          (block.shared ? '<span class="shared-pill">Shared</span>' : '<span class="role-pill">'+block.owner+'</span>') +
          block.notes.map(n => '<p class="note">'+n+'</p>').join('') +
          '<div class="task-line"><div class="label">'+block.label+'</div><div class="action">'+block.action+'</div></div>' +
          '</div>' +
          (sopTargets.length ? '<button class="sop-btn" type="button" aria-label="SOP Procedure öffnen">SOP</button>' : '');
        card.querySelector('input').addEventListener('change', e => {
          if (e.target.checked) localStorage.setItem(storageKey,'1'); else localStorage.removeItem(storageKey);
          render();
        });
        if (sopTargets.length) card.querySelector('.sop-btn').addEventListener('click', () => openSop(block, sopTargets));
        checklist.appendChild(card);
        return;
      }
      const tb = document.createElement('div');
      tb.className = 'text-block' + (block.isCondition?' condition-block':'');
      if (block.isCondition) {
        const conditionKey = conditionKeyFor(state, block.conditionId);
        const enabled = localStorage.getItem(conditionKey) === '1';
        tb.innerHTML =
          '<div class="condition-copy">'+block.notes.map(n=>'<p class="note">'+n+'</p>').join('')+block.html+'</div>' +
          '<label class="switch" aria-label="Bedingung aktivieren">' +
          '<input type="checkbox"'+(enabled?' checked':'')+'>'+
          '<span class="switch-off">NO</span><span class="switch-on">YES</span></label>';
        tb.querySelector('input').addEventListener('change', e => {
          if (e.target.checked) localStorage.setItem(conditionKey,'1'); else localStorage.removeItem(conditionKey);
          render();
        });
      } else {
        tb.innerHTML = block.notes.map(n=>'<p class="note">'+n+'</p>').join('')+block.html;
      }
      checklist.appendChild(tb);
    });
    return { itemCount, doneCount };
  }

  /* ══════════════════════════════════════════════════════════
     RENDER LEARN MODE  (Retrieval Practice)
  ══════════════════════════════════════════════════════════ */
  function renderLearn(phase, relevant, state) {
    const items = relevant.filter(b => b.type === 'item');
    const total  = items.length;
    const known  = items.filter(b => getLearnStatus(state, b) === 'knew').length;
    const toLearn = items.filter(b => getLearnStatus(state, b) !== 'knew');

    // header row
    const hdr = document.createElement('div');
    hdr.className = 'learn-header';
    hdr.innerHTML =
      '<span class="learn-counter">'+known+' / '+total+' bekannt</span>' +
      '<span style="font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;">' +
      toLearn.length + ' zu lernen</span>';
    checklist.appendChild(hdr);

    if (toLearn.length === 0) {
      const done = document.createElement('div');
      done.className = 'learn-all-done';
      done.innerHTML =
        '<div class="checkmark">✅</div>' +
        '<p>Alle '+total+' Items dieser Phase bekannt!</p>' +
        '<button class="learn-restart-btn" id="learnRestart">Phase zurücksetzen</button>';
      done.querySelector('#learnRestart').addEventListener('click', () => {
        items.forEach(b => setLearnStatus(state, b, null));
        render();
      });
      checklist.appendChild(done);
      return { itemCount: total, doneCount: known };
    }

    toLearn.forEach(block => {
      const sopTargets = resolveSopTargets(block);
      const card = document.createElement('div');
      card.className = 'learn-card';
      card.dataset.id = block.id;

      const top = document.createElement('div');
      top.className = 'learn-card-top';
      top.innerHTML =
        (block.shared ? '<span class="shared-pill" style="display:inline-flex;margin-bottom:6px;">Shared</span>' :
                        '<span class="role-pill" style="display:inline-flex;margin-bottom:6px;">'+block.owner+'</span>') +
        block.notes.map(n => '<p class="learn-note">'+n+'</p>').join('') +
        '<div class="learn-label">'+block.label+'</div>';
      card.appendChild(top);

      // Hidden action row – tap to reveal
      const hiddenRow = document.createElement('div');
      hiddenRow.className = 'learn-action-hidden';
      hiddenRow.setAttribute('role','button');
      hiddenRow.setAttribute('aria-label','Action aufdecken');
      hiddenRow.innerHTML =
        '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z"/><circle cx="8" cy="8" r="2"/></svg>' +
        'Tippen zum Aufdecken';
      card.appendChild(hiddenRow);

      hiddenRow.addEventListener('click', () => {
        hiddenRow.style.display = 'none';
        revealedRow.style.display = 'flex';
        card.classList.add('revealed');
      });

      // Revealed action row
      const revealedRow = document.createElement('div');
      revealedRow.className = 'learn-action-revealed';
      revealedRow.style.display = 'none';
      revealedRow.innerHTML =
        '<div>' +
        '<div class="learn-action-text">'+block.action+'</div>' +
        (sopTargets.length ? '<button class="learn-sop-link" style="margin-top:4px;display:block;">SOP ansehen ↗</button>' : '') +
        '</div>' +
        '<div class="learn-buttons">' +
        '<button class="learn-btn review" aria-label="Nochmal lernen">✗ Nochmal</button>' +
        '<button class="learn-btn knew"   aria-label="Wusste ich">✓ Wusste ich</button>' +
        '</div>';

      if (sopTargets.length) {
        revealedRow.querySelector('.learn-sop-link').addEventListener('click', () => openSop(block, sopTargets));
      }
      revealedRow.querySelector('.learn-btn.knew').addEventListener('click', () => {
        setLearnStatus(state, block, 'knew');
        card.style.opacity = '0'; card.style.transform = 'translateX(60px)';
        card.style.transition = 'opacity .25s, transform .3s';
        setTimeout(() => render(), 280);
      });
      revealedRow.querySelector('.learn-btn.review').addEventListener('click', () => {
        // Put back to end of list – just re-render
        card.style.opacity = '0'; card.style.transform = 'translateX(-40px)';
        card.style.transition = 'opacity .2s, transform .25s';
        setTimeout(() => render(), 230);
      });

      card.appendChild(revealedRow);
      checklist.appendChild(card);
    });

    return { itemCount: total, doneCount: known };
  }


  /* ══════════════════════════════════════════════════════════
     RENDER ORDER MODE  (drag & drop sequencing)
  ══════════════════════════════════════════════════════════ */
  let orderState = null;

  function renderOrder(phase, relevant, state) {
    const items = relevant.filter(b => b.type === 'item');
    if (items.length < 2) {
      checklist.innerHTML = '<div class="empty">Diese Phase enthält zu wenig Items für das Reihenfolge-Training.</div>';
      return { itemCount: items.length, doneCount: 0 };
    }
    if (!orderState) {
      orderState = {
        arr: items.map((b, i) => ({ block: b, origIdx: i })).sort(() => Math.random() - 0.5),
        items: items.map((b, i) => ({ block: b, origIdx: i })),
        solved: false
      };
    }
    const qs = orderState;

    checklist.innerHTML = '';

    const hint = document.createElement('div');
    hint.className = 'order-hint';
    hint.innerHTML = 'Am <strong>⠿</strong> Handle ziehen um Karten zu verschieben. Dann auf <strong>Prüfen</strong> tippen.';
    checklist.appendChild(hint);

    const listEl = document.createElement('div');
    listEl.className = 'order-board';
    checklist.appendChild(listEl);

    const actions = document.createElement('div');
    actions.className = 'order-actions';
    const checkBtn = document.createElement('button');
    checkBtn.className = 'order-check-btn';
    checkBtn.textContent = 'Prüfen';
    const resetBtn = document.createElement('button');
    resetBtn.className = 'order-reset-btn';
    resetBtn.textContent = 'Neu mischen';
    const solBtn = document.createElement('button');
    solBtn.className = 'order-reset-btn';
    solBtn.textContent = 'Lösung';
    actions.appendChild(checkBtn);
    actions.appendChild(resetBtn);
    actions.appendChild(solBtn);
    checklist.appendChild(actions);

    const feedback = document.createElement('div');
    checklist.appendChild(feedback);

    function buildList(markResult) {
      listEl.innerHTML = '';
      qs.arr.forEach((entry, idx) => {
        const b = entry.block;
        const card = document.createElement('div');
        card.className = 'order-card';
        card.dataset.idx = String(idx);
        if (markResult) card.classList.add(entry.origIdx === idx ? 'correct' : 'wrong');
        card.innerHTML =
          '<div class="order-index">' + (idx + 1) + '</div>' +
          '<div class="order-drag-icon">⠿</div>' +
          '<div class="order-body">' +
            (b.shared ? '<span class="shared-pill">Shared</span>' : '<span class="role-pill">' + b.owner + '</span>') +
            '<div class="task-line">' +
              '<div class="label">' + b.label + '</div>' +
              '<div class="action">' + b.action + '</div>' +
            '</div>' +
          '</div>';
        listEl.appendChild(card);
      });
    }

    buildList(false);

    /* ── Touch drag-sort (handle-only, scroll safe) ── */
    let drag = null;
    let pendingTimer = null;

    function startDrag(card, touchY) {
      if (drag) return;
      const cards = [...listEl.querySelectorAll('.order-card')];
      const itemH = card.getBoundingClientRect().height + 10;
      // Lock scroll only while dragging
      listEl.style.touchAction = 'none';
      document.body.style.overflow  = 'hidden';
      cards.forEach(el => { el.style.transition = 'transform 0.15s ease'; el.style.transform = 'none'; });
      card.style.transition = 'none';
      card.style.zIndex = '20';
      card.style.boxShadow = '0 10px 30px rgba(0,0,0,.22)';
      card.style.transform = 'scale(1.03)';
      drag = { card, cards, itemH, startY: touchY, fromIdx: parseInt(card.dataset.idx, 10), currentIdx: parseInt(card.dataset.idx, 10) };
    }

    function moveDrag(touchY) {
      if (!drag) return;
      const dy = touchY - drag.startY;
      drag.card.style.transform = 'scale(1.03) translateY(' + dy + 'px)';
      const newIdx = Math.max(0, Math.min(drag.cards.length - 1, drag.fromIdx + Math.round(dy / drag.itemH)));
      if (newIdx !== drag.currentIdx) {
        drag.currentIdx = newIdx;
        drag.cards.forEach((el, i) => {
          if (el === drag.card) return;
          let sh = 0;
          if (drag.fromIdx < newIdx && i > drag.fromIdx && i <= newIdx) sh = -drag.itemH;
          if (drag.fromIdx > newIdx && i < drag.fromIdx && i >= newIdx) sh =  drag.itemH;
          el.style.transform = sh ? 'translateY(' + sh + 'px)' : 'none';
        });
      }
    }

    function endDrag() {
      if (!drag) return;
      const { fromIdx, currentIdx, cards } = drag;
      drag = null;
      listEl.style.touchAction = '';
      document.body.style.overflow = '';
      if (fromIdx !== currentIdx) {
        const [moved] = qs.arr.splice(fromIdx, 1);
        qs.arr.splice(currentIdx, 0, moved);
      }
      cards.forEach(el => { el.style.cssText = ''; });
      buildList(false);
      feedback.innerHTML = '';
    }

    // Only the drag handle triggers immediate drag; rest of card does nothing on scroll
    listEl.addEventListener('touchstart', function(e) {
      const handle = e.target.closest('.order-drag-icon');
      if (!handle) return;
      const card = handle.closest('.order-card');
      if (!card) return;
      e.preventDefault();
      startDrag(card, e.touches[0].clientY);
    }, { passive: false });

    listEl.addEventListener('touchmove', function(e) {
      if (!drag) return;
      e.preventDefault();
      moveDrag(e.touches[0].clientY);
    }, { passive: false });

    listEl.addEventListener('touchend', function(e) {
      if (pendingTimer) { clearTimeout(pendingTimer); pendingTimer = null; }
      endDrag();
    });

    listEl.addEventListener('touchcancel', function(e) {
      if (pendingTimer) { clearTimeout(pendingTimer); pendingTimer = null; }
      endDrag();
    });

    checkBtn.addEventListener('click', () => {
      const correct = qs.arr.every((e, i) => e.origIdx === i);
      qs.solved = correct;
      buildList(true);
      feedback.innerHTML = correct
        ? '<div class="order-success">✓ Perfekt! Die Reihenfolge stimmt vollständig.</div>'
        : '<div class="order-wrong-msg">' + qs.arr.filter((e,i) => e.origIdx !== i).length + ' Item(s) noch falsch — rot markiert.</div>';
    });

    resetBtn.addEventListener('click', () => { orderState = null; render(); });

    solBtn.addEventListener('click', () => {
      qs.arr = [...qs.items].sort((a, b) => a.origIdx - b.origIdx);
      qs.solved = true;
      buildList(true);
      feedback.innerHTML = '<div class="order-success">Lösung eingeblendet — korrekte Reihenfolge sichtbar.</div>';
    });

    const solved = qs.solved && qs.arr.every((e, i) => e.origIdx === i);
    return { itemCount: items.length, doneCount: solved ? items.length : 0 };
  }
  /* ══════════════════════════════════════════════════════════
     PHASE OVERVIEW (bottom of status)
  ══════════════════════════════════════════════════════════ */
  function renderPhaseOverview(state) {
    if (appMode !== 'learn') { phaseOverview.innerHTML = ''; return; }
    phaseOverview.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'phase-overview';
    wrap.innerHTML = '<div class="phase-overview-title">Lernfortschritt alle Phasen</div>' +
                     '<div class="phase-overview-grid" id="pogrid"></div>';
    const grid = wrap.querySelector('#pogrid');
    phases.forEach((ph, idx) => {
      const { total, known } = learnProgressForPhase(idx, state);
      if (total === 0) return;
      const pct = Math.round((known/total)*100);
      const item = document.createElement('div');
      item.className = 'phase-overview-item';
      item.innerHTML =
        '<div class="phase-overview-name" title="'+ph.title+'">'+ph.title+'</div>' +
        '<div class="phase-overview-bar"><div class="phase-overview-fill" style="width:'+pct+'%"></div></div>' +
        '<div class="phase-overview-pct">'+known+'/'+total+' ('+pct+'%)</div>';
      item.addEventListener('click', () => {
        phaseSelect.value = String(idx);
        render();
        window.scrollTo({top:0,behavior:'smooth'});
      });
      grid.appendChild(item);
    });
    phaseOverview.appendChild(wrap);
  }

  /* ══════════════════════════════════════════════════════════
     MAIN RENDER
  ══════════════════════════════════════════════════════════ */
  function render() {
    const state = readState();
    // Reset quiz when switching phases or modes
    if (appMode !== 'order') orderState = null;

    const phase    = phases[Number(state.phase)] || phases[0];
    const relevant = phase.blocks.filter(b => isVisibleBlock(b, phase.blocks, state));
    checklist.innerHTML = '';

    let itemCount = 0, doneCount = 0;

    if (appMode === 'ref') {
      const counts = renderRef(phase, relevant, state);
      itemCount = counts.itemCount; doneCount = counts.doneCount;
      progressLabel.textContent = 'Abgehakt';
    } else if (appMode === 'learn') {
      const counts = renderLearn(phase, relevant, state);
      itemCount = counts.itemCount; doneCount = counts.doneCount;
      progressLabel.textContent = 'Bekannt';
    } else if (appMode === 'order') {
      const counts = renderOrder(phase, relevant, state);
      itemCount = counts.itemCount; doneCount = counts.doneCount;
      progressLabel.textContent = 'Reihenfolge';
    }

    if (!relevant.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'Für diese Auswahl sind in dieser Flugphase keine Punkte hinterlegt.';
      checklist.appendChild(empty);
    }

    // Update status bar
    const modeLabel = {ref:'Referenz', learn:'Learn', quiz:'Reihenfolge'}[appMode];
    statusMain.textContent = state.crewRole+' / '+state.flightFunction+(state.transitOnly?' · Transit':'')+' · '+phase.title;
    statusSub.textContent  = itemCount
      ? doneCount+' von '+itemCount+' '+(appMode==='learn'?'Items bekannt':'Punkten erledigt')
      : 'Keine Items in dieser Auswahl';

    // Update progress bar
    const pct = itemCount ? Math.round((doneCount/itemCount)*100) : 0;
    progressBar.style.width = pct + '%';
    progressPct.textContent  = itemCount ? pct+'%' : '–';

    renderPhaseOverview(state);
  }

  /* ── Reset ── */
  function resetCurrentPhase() {
    const state = readState();
    const phase = phases[Number(state.phase)] || phases[0];
    if (appMode === 'ref') {
      phase.blocks.filter(b => b.type==='item' && isVisibleBlock(b,phase.blocks,state))
        .forEach(b => localStorage.removeItem(keyFor(state,b)));
    } else if (appMode === 'learn') {
      phase.blocks.filter(b => b.type==='item' && isVisibleBlock(b,phase.blocks,state))
        .forEach(b => setLearnStatus(state,b,null));
    } else if (appMode === 'order') {
      orderState = null;
    }
    render();
  }

  /* ── Event listeners ── */
  document.querySelectorAll('input[name="crewRole"],input[name="flightFunction"]').forEach(i => i.addEventListener('change', () => { orderState=null; render(); }));
  phaseSelect.addEventListener('change', () => { orderState=null; render(); });
  transitOnly.addEventListener('change', () => { orderState=null; render(); });
  resetPhase.addEventListener('click', resetCurrentPhase);
  sopClose.addEventListener('click', closeSop);
  sopOverlay.addEventListener('click', e => { if (e.target===sopOverlay) closeSop(); });
  document.addEventListener('keydown', e => { if (e.key==='Escape' && sopOverlay.classList.contains('open')) closeSop(); });

  render();
})();
  </script>
